version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: matcha-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-matcha}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - matcha-network

volumes:
  postgres_data:

networks:
  matcha-network:
    driver: bridge
